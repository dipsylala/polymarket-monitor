name: Polymarket Monitor

on:
  schedule:
    - cron: "0 * * * *"   # every hour
  workflow_dispatch:       # allow manual trigger from Actions tab

permissions:
  contents: write          # needed to commit the updated DB back

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          uv venv .venv --clear
          uv pip install -r requirements.txt

      - name: Run monitor
        env:
          ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
          ALERT_REPOSITORY: dipsylala/polymarket-monitor-private
          ALERT_REPO_TOKEN: ${{ secrets.PRIVATE_ALERT_REPO_TOKEN }}
        run: .venv/bin/python main.py

      - name: Commit updated database
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add polymarket_monitor.db
          git diff --cached --quiet || git commit -m "chore: update scan state [skip ci]"
          git push
